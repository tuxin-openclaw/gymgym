    <title>GymGym · 健身记录</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('gymgym-settings') || '{}').state || {}
        var t = s.theme || 'dark'
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
        // iOS 主屏应用：浅色主题下用默认状态栏，否则白字会看不见
        if (!d) document.getElementById('ios-status-bar').setAttribute('content', 'default')
      } catch (e) {}
    </script>
